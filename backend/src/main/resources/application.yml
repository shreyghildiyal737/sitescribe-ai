server:
  port: 8090

spring:
  application:
    name: sitescribe-backend
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/sitescribe;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

sitescribe:
  # Security
  # Blank means a random key per process (sessions end on restart). Must be 32+ bytes when set.
  jwt-secret: ${JWT_SECRET:}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:8091}
  auth-rate-limit-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:10}
  # AI
  ai:
    mode: ${AI_MODE:mock}
    provider: ${AI_PROVIDER:mock}
    api-key: ${GROQ_API_KEY:}
    gemini-api-key: ${GEMINI_API_KEY:}
  # File storage
  storage:
    mode: ${STORAGE_MODE:local}
    local-dir: ${UPLOADS_DIR:./uploads}
    supabase-url: ${SUPABASE_URL:}
    supabase-service-key: ${SUPABASE_SERVICE_KEY:}
    supabase-bucket: ${SUPABASE_BUCKET:audio-uploads}
  # Email
  email:
    api-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:noreply@sitescribe.ai}
    app-url: ${APP_URL:http://localhost:8091}

# The API schema stays private unless explicitly switched on (start.ps1 does, for local work).
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

# Error monitoring — disabled when DSN is not set
sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 0.2

logging:
  level:
    org.hibernate.SQL: warn
