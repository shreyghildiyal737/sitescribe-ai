# Test profile — in-memory H2 so tests never touch the dev file DB or conflict
# with a running server. Inherits everything else (Flyway, JWT, AI=mock) from
# the base application.yml.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

# The suite signs up many companies from one address; the limiter has its own unit test.
sitescribe:
  auth-rate-limit-per-minute: 1000
