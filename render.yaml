# The public demo backend: one free Render web service built from backend/Dockerfile,
# against a Neon Postgres, because Render's own free database is deleted after 30 days.
# The frontend goes on Vercel with its root directory set to frontend/.
services:
  - type: web
    name: sitescribe-backend
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      # Neon gives a postgres:// URL; this needs the JDBC form, with the user and password
      # split out: jdbc:postgresql://<host>/<db>?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_DRIVER
        value: org.postgresql.Driver
      # Generated by Render so sessions survive a restart and the value is never committed.
      - key: JWT_SECRET
        generateValue: true
      # The Vercel URL of the frontend, comma separated if there is more than one.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      # mock runs the whole workflow with no AI keys. Switch to live once fresh Groq and
      # Gemini keys are set below.
      - key: AI_MODE
        value: mock
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # The free instance's disk is wiped on restart, so recordings must go to Supabase
      # once it is set up. Until then local mode works but loses audio on each deploy.
      - key: STORAGE_MODE
        value: local
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k -XX:+ExitOnOutOfMemoryError"
